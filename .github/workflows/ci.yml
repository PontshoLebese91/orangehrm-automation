name: OrangeHRM E2E Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

# Required permissions:
# contents: read  -> checkout repository
# pages: write    -> publish GitHub Pages
# id-token: write -> authenticate GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  # ============================================================
  # RUN TESTS + GENERATE ALLURE REPORT
  # ============================================================
  test:
    name: Run OrangeHRM Tests
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Node.js
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------------
      # Install Playwright
      # --------------------------------------------------------
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # --------------------------------------------------------
      # Run Cucumber / Playwright tests
      # --------------------------------------------------------
      - name: Run Cucumber tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          HEADLESS: true
        run: npm run Test:all

      # --------------------------------------------------------
      # Generate Allure report
      # --------------------------------------------------------
      - name: Generate Allure report
        if: always()
        run: |
          npx allure generate allure-results \
            --clean \
            -o allure-report

      # --------------------------------------------------------
      # Upload Allure report as GitHub Actions artifact
      # --------------------------------------------------------
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: warn

      # --------------------------------------------------------
      # Upload raw Allure results
      # --------------------------------------------------------
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn

      # --------------------------------------------------------
      # Upload Playwright failure screenshots / test results
      # --------------------------------------------------------
      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

      # --------------------------------------------------------
      # Configure GitHub Pages
      # --------------------------------------------------------
      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5

      # --------------------------------------------------------
      # Package Allure report for GitHub Pages
      # --------------------------------------------------------
      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report


  # ============================================================
  # DEPLOY ALLURE REPORT TO GITHUB PAGES
  # ============================================================
  deploy:
    name: Publish Allure Report
    needs: test
    if: always()

    runs-on: ubuntu-latest

    # Explicit permissions for deployment
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # --------------------------------------------------------
      # Deploy to GitHub Pages
      # --------------------------------------------------------
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4